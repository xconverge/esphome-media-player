substitutions:
  # Display rotation in degrees: 0, 90, 180, or 270
  # Rotate to match your preferred mounting orientation / power cable direction
  display_rotation: "0"

  # Device profile
  screen_width: "480"
  screen_height: "480"
  artwork_size: "480"
  artwork_display_size: "480"
  clock_cx: "240"
  clock_cy: "240"
  device_slug: "guition-esp32-s3-4848s040"
  firmware_manifest_slug: "4848s040"
  post_artwork_script: "start_hide_track_info_timer"
  track_info_duration_default: "5"
  pause_lvgl_on_screen_off: "true"
  clock_screensaver_supported: "true"
  idle_action_default: "Clock"

  # Custom settings panel: favorites grid + compact single-speaker volume row.
  # These override the empty/stock defaults in common/device/base.yaml so the
  # shared speaker_group/sensors scripts drive this device's extra widgets
  # (fav_volume_card, fav_vol_pct, media_shuffle_button) without other devices
  # ever referencing IDs they don't define.
  shuffle_button_style_apply: |-
    if (on) {
      lv_obj_set_style_bg_color(id(media_shuffle_button), lv_color_make(0xFF, 0x8C, 0x00), 0);
    } else {
      lv_obj_set_style_bg_color(id(media_shuffle_button), lv_color_make(0x31, 0x31, 0x31), 0);
    }
  volume_panel_extra_hide: |-
    lv_obj_add_flag(id(fav_volume_card), LV_OBJ_FLAG_HIDDEN);
  single_speaker_volume_show: |-
    lv_label_set_text(id(fav_vol_pct), buf);
    lv_obj_add_flag(id(volume_arc), LV_OBJ_FLAG_HIDDEN);
    lv_obj_add_flag(id(volume_title_label), LV_OBJ_FLAG_HIDDEN);
    lv_obj_add_flag(id(volume_pct_label), LV_OBJ_FLAG_HIDDEN);
    lv_obj_add_flag(id(volume_down_button), LV_OBJ_FLAG_HIDDEN);
    lv_obj_add_flag(id(volume_up_button), LV_OBJ_FLAG_HIDDEN);
    lv_obj_clear_flag(id(fav_volume_card), LV_OBJ_FLAG_HIDDEN);

  # Setup screens
  setup_content_width: "420"
  setup_pad_row: "16"
  setup_instructions_pad_top: "8"
  setup_icon_font: "$icon_font"
  setup_button_width: "180"
  setup_button_height: "44"
  setup_button_radius: "22"
  setup_button_font: "roboto19_font"
  loading_pad_row: "16"
  loading_bar_width: "80"
  loading_bar_height: "4"
  loading_bar_radius: "3"
  loading_bar_pad_top: "24"

packages:
  # Common
  base: !include ../../common/device/base.yaml
  web_settings: !include ../../common/addon/web_settings.yaml

  # Device-specific
  device: !include device/device.yaml
  web_activity: !include device/web_activity.yaml
  lvgl: !include device/lvgl.yaml
  fonts: !include assets/fonts.yaml
  icons: !include assets/icons.yaml
  button: !include theme/button.yaml

  # Sonos favorites (dynamic playlist buttons in the settings panel)
  favorites: !include addon/favorites.yaml
